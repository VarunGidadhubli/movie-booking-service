
spring:
  application:
    name: movie-booking-service

  datasource:
    url: jdbc:mysql://localhost:3307/movie_booking
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s

logging:
  level:
    org.hibernate.SQL: DEBUG

security:
  jwt:
    secret: ${JWT_SECRET}