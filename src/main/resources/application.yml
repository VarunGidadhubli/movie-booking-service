
spring:
  application:
    name: movie-booking-service

  datasource:
    url: jdbc:mysql://localhost:3307/movie_booking
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: booking-service-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.movie.booking.event
        spring.json.value.default.type: com.movie.booking.event.BookingCreatedEvent

logging:
  level:
    org.hibernate.SQL: DEBUG

security:
  jwt:
    secret: ${JWT_SECRET}