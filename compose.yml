services:
  mysql:
    image: mysql:8.4
    container_name: movie-booking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - movie-booking-mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: movie-booking-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  movie-booking-mysql-data: