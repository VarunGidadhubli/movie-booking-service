services:

  mysql:
    image: mysql:8.4
    container_name: movie-booking-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3307:3306"

    volumes:
      - movie-booking-mysql-data:/var/lib/mysql

volumes:
  movie-booking-mysql-data: